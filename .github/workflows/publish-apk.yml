name: Publish Android Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "apk-distribution/app-debug.apk"
      - "apk-distribution/chunks/**"
      - "apk-distribution/app-debug.apk.sha256"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate APK and SHA-256 checksum
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"
          CHUNKS_DIR="apk-distribution/chunks"

          if [ ! -s "$APK_PATH" ]; then
            shopt -s nullglob
            CHUNKS=( "$CHUNKS_DIR"/chunk-*.bin )
            shopt -u nullglob

            if [ "${#CHUNKS[@]}" -gt 0 ]; then
              echo "Reassembling $APK_PATH from ${#CHUNKS[@]} verified chunks..."
              LC_ALL=C cat "$CHUNKS_DIR"/chunk-*.bin > "$APK_PATH"
            fi
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Missing APK file at $APK_PATH (and no chunks found in $CHUNKS_DIR)"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file at $APK_PATH is empty"
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ]; then
            echo "::error::Missing SHA-256 checksum file at $SHA_PATH"
            exit 1
          fi

          if [ ! -s "$SHA_PATH" ]; then
            echo "::error::SHA-256 checksum file at $SHA_PATH is empty"
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)

          unzip -tq "$APK_PATH"

          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          APK_SIZE_HUMAN="$(numfmt --to=iec-i --suffix=B "$APK_SIZE_BYTES" 2>/dev/null || ls -lh "$APK_PATH" | awk '{print $5}')"

          {
            echo "apk_sha256=$APK_SHA256"
            echo "apk_size_bytes=$APK_SIZE_BYTES"
            echo "apk_size_human=$APK_SIZE_HUMAN"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.validate.outputs.apk_sha256 }}
          APK_SIZE_BYTES: ${{ steps.validate.outputs.apk_size_bytes }}
          APK_SIZE_HUMAN: ${{ steps.validate.outputs.apk_size_human }}
        run: |
          set -euo pipefail

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK_PATH="apk-distribution/app-debug.apk"
          DIRECT_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $RELEASE_TAG already exists; refusing to overwrite."
            exit 1
          fi

          RELEASE_NOTES="$(printf '%s\n' \
            "Prebuilt Android debug APK compiled in Google AI Studio and published automatically via GitHub Actions." \
            "" \
            "- **Release Tag:** \`${RELEASE_TAG}\`" \
            "- **Asset Filename:** \`app-debug.apk\`" \
            "- **APK Size:** ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)" \
            "- **SHA-256:** \`${APK_SHA256}\`" \
            "- **Direct Latest Download:** ${DIRECT_DOWNLOAD_URL}")"

          RELEASE_URL="$(gh release create "$RELEASE_TAG" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Debug APK Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "$RELEASE_NOTES" \
            --latest)"

          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_url=$RELEASE_URL"
            echo "direct_download_url=$DIRECT_DOWNLOAD_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: success()
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          DIRECT_DOWNLOAD_URL: ${{ steps.publish.outputs.direct_download_url }}
          APK_SHA256: ${{ steps.validate.outputs.apk_sha256 }}
          APK_SIZE_BYTES: ${{ steps.validate.outputs.apk_size_bytes }}
          APK_SIZE_HUMAN: ${{ steps.validate.outputs.apk_size_human }}
        run: |
          set -euo pipefail
          {
            echo "## Android Debug APK Published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **Release Tag** | \`${RELEASE_TAG}\` |"
            echo "| **APK Size** | ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes) |"
            echo "| **SHA-256** | \`${APK_SHA256}\` |"
            echo "| **GitHub Release Page** | ${RELEASE_URL} |"
            echo "| **Direct Latest APK Download** | ${DIRECT_DOWNLOAD_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
